# =============================================================================
# CI Pipeline — SaaS Inmobiliario Backend
# Se ejecuta en: push a main/develop, pull requests a main
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/saas_test"
  JWT_SECRET: "ci-test-secret-do-not-use-in-production"
  PLATFORM_TENANT_ID: "00000000-0000-0000-0000-000000000000"
  SUPER_ADMIN_EMAIL: "ci@test.com"
  SUPER_ADMIN_PASSWORD: "CI_Test_Password_2026!"

jobs:
  # ── Job 1: Lint y Build ─────────────────────────────────────────────────────
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Compile TypeScript
        working-directory: backend
        run: npm run build

      - name: Bundle OpenAPI spec
        working-directory: backend
        run: npm run openapi:bundle

      - name: Lint OpenAPI spec
        working-directory: backend
        run: npm run openapi:lint

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist/
          retention-days: 5

  # ── Job 2: Tests de Integración ─────────────────────────────────────────────
  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend/dist/

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Run database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run seed
        working-directory: backend
        run: npm run seed

      - name: Run integration tests
        working-directory: backend
        run: npm test -- --forceExit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/coverage/
          retention-days: 5

  # ── Job 3: Docker Build (verificar que el Dockerfile compila) ───────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Saas-Inmobiliario/backend
          push: false
          tags: saas-inmobiliario-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
