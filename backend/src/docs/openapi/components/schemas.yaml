# Schemas reutilizados en 2+ lugares del contrato.
# Request bodies de un solo uso van inline en cada path file.

# ── PRIMITIVOS ─────────────────────────────────────────────────────────────

ApiError:
  type: object
  required: [statusCode, error, message]
  properties:
    statusCode:
      type: integer
      example: 400
    error:
      type: string
      example: "Bad Request"
    message:
      type: string
      example: "El campo 'name' es requerido"
    details:
      type: array
      items:
        type: object
        properties:
          field: { type: string }
          message: { type: string }

BaseEntity:
  type: object
  required: [id, clientId, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    clientId:
      type: string
      format: uuid
      readOnly: true
      description: Asignado desde JWT — nunca desde el body
    createdAt:
      type: string
      format: date-time
      readOnly: true
    updatedAt:
      type: string
      format: date-time
      readOnly: true
    deletedAt:
      type: string
      format: date-time
      nullable: true
      readOnly: true

# ── ENUMS ──────────────────────────────────────────────────────────────────

UserRole:
  type: string
  enum: [SUPER_ADMIN, ADMIN_TENANT, ADMINISTRATIVA, PORTERIA]
  example: ADMIN_TENANT

TenantStatus:
  type: string
  enum: [ACTIVE, SUSPENDED, INACTIVE]
  example: ACTIVE

TenantPlan:
  type: string
  enum: [BASIC, PREMIUM, ENTERPRISE]
  description: "BASIC: 1 prop / 100 unid / 5 users | PREMIUM: múltiple / 500 / 15 | ENTERPRISE: sin límite"
  example: BASIC

UnitStatus:
  type: string
  enum: [AVAILABLE, OCCUPIED, MAINTENANCE]
  example: AVAILABLE

UnitType:
  type: string
  enum: [APARTMENT, HOUSE, COMMERCIAL, PARKING]
  example: APARTMENT

PropertyType:
  type: string
  enum: [CONJUNTO, EDIFICIO, TORRE, CASA_INDEPENDIENTE]
  example: CONJUNTO

OccupancyType:
  type: string
  enum: [OWNER, TENANT]
  description: "OWNER: propietario | TENANT: arrendatario"
  example: TENANT

FeeStatus:
  type: string
  enum: [PENDING, PAID, PARTIAL]
  example: PENDING

FeeType:
  type: string
  enum: [PERIODIC, EXTRAORDINARY, ADJUSTMENT]
  example: PERIODIC

MaintenanceStatus:
  type: string
  enum: [PENDING, IN_PROGRESS, RESOLVED, CANCELLED]
  description: "CANCELLED: solicitud abortada antes de resolverse"
  example: PENDING

AuditAction:
  type: string
  enum: [CREATE, UPDATE, DELETE, SUSPEND, ACTIVATE, STATUS_CHANGE, ROLE_CHANGE]
  example: CREATE

# ── PAGINATION ──────────────────────────────────────────────────────────────

PaginatedResponse:
  type: object
  required: [data, total, page, limit]
  properties:
    data:
      type: array
      description: Elementos de la página
    total:
      type: integer
      description: Total de elementos sin paginación
      example: 87
    page:
      type: integer
      description: Número de página actual (1-based)
      example: 1
    limit:
      type: integer
      description: Cantidad de elementos por página
      example: 20

# ── ENTIDADES DE RESPUESTA (usadas en list + single + como anidadas) ───────

Tenant:
  allOf:
    - $ref: '#/BaseEntity'
    - type: object
      required: [name, subdomain, plan, status]
      properties:
        name:
          type: string
          example: Conjunto Residencial El Prado
        subdomain:
          type: string
          example: elprado
        plan:
          $ref: '#/TenantPlan'
        status:
          $ref: '#/TenantStatus'
        contactEmail:
          type: string
          format: email
          nullable: true
        contactPhone:
          type: string
          nullable: true

User:
  allOf:
    - $ref: '#/BaseEntity'
    - type: object
      required: [email, role, isActive]
      properties:
        email:
          type: string
          format: email
          example: portero@elprado.com
        role:
          $ref: '#/UserRole'
        isActive:
          type: boolean
          example: true
        firstName:
          type: string
          nullable: true
          example: Carlos
        lastName:
          type: string
          nullable: true
          example: Ramírez

Permission:
  type: object
  required: [id, resource, action]
  properties:
    id:
      type: string
      format: uuid
    resource:
      type: string
      example: properties
    action:
      type: string
      enum: [read, create, update, delete]

Role:
  type: object
  required: [id, name, permissions]
  properties:
    id:
      type: string
      format: uuid
    name:
      $ref: '#/UserRole'
    description:
      type: string
      nullable: true
    permissions:
      type: array
      items:
        $ref: '#/Permission'

Property:
  allOf:
    - $ref: '#/BaseEntity'
    - type: object
      required: [name, propertyType]
      properties:
        name:
          type: string
          example: Conjunto El Prado
        propertyType:
          $ref: '#/PropertyType'
        address:
          type: string
          nullable: true
          example: "Calle 15 # 24-30, Bogotá"
        description:
          type: string
          nullable: true
        towersCount:
          type: integer
          readOnly: true
          example: 3
        unitsCount:
          type: integer
          readOnly: true
          example: 120

Tower:
  allOf:
    - $ref: '#/BaseEntity'
    - type: object
      required: [propertyId, name]
      properties:
        propertyId:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          example: Torre A
        floorsCount:
          type: integer
          nullable: true
          example: 12
        unitsCount:
          type: integer
          readOnly: true
          example: 40

Unit:
  allOf:
    - $ref: '#/BaseEntity'
    - type: object
      required: [propertyId, identifier, status, unitType]
      properties:
        propertyId:
          type: string
          format: uuid
          readOnly: true
        towerId:
          type: string
          format: uuid
          nullable: true
          description: Null si pertenece directo a la propiedad (sin torre)
        identifier:
          type: string
          example: Apto 101
        unitType:
          $ref: '#/UnitType'
        floor:
          type: integer
          nullable: true
          example: 1
        status:
          $ref: '#/UnitStatus'
        monthlyFeeAmount:
          type: number
          format: float
          minimum: 0
          multipleOf: 0.01
          nullable: true
          example: 350000.00

Resident:
  allOf:
    - $ref: '#/BaseEntity'
    - type: object
      required: [firstName, lastName, documentType, documentNumber]
      properties:
        firstName:
          type: string
          example: María
        lastName:
          type: string
          example: González
        documentType:
          type: string
          enum: [CC, CE, PASSPORT, NIT]
          example: CC
        documentNumber:
          type: string
          example: "1098765432"
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        emergencyContact:
          type: string
          nullable: true

Occupancy:
  allOf:
    - $ref: '#/BaseEntity'
    - type: object
      required: [unitId, residentId, type, startDate, isActive]
      properties:
        unitId:
          type: string
          format: uuid
          readOnly: true
        residentId:
          type: string
          format: uuid
          readOnly: true
        type:
          $ref: '#/OccupancyType'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        isActive:
          type: boolean
          readOnly: true
        notes:
          type: string
          nullable: true
        unit:
          $ref: '#/Unit'
        resident:
          $ref: '#/Resident'

FeeStatusHistory:
  type: object
  required: [id, feeId, toStatus, changedAt, changedBy]
  properties:
    id:
      type: string
      format: uuid
    feeId:
      type: string
      format: uuid
    fromStatus:
        $ref: '#/FeeStatus'
    toStatus:
      $ref: '#/FeeStatus'
    paidAmount:
      type: number
      format: float
      nullable: true
    notes:
      type: string
      nullable: true
    changedAt:
      type: string
      format: date-time
    changedBy:
      type: string
      format: uuid

Fee:
  allOf:
    - $ref: '#/BaseEntity'
    - type: object
      required: [unitId, type, amount, period, status]
      properties:
        unitId:
          type: string
          format: uuid
          readOnly: true
        type:
          $ref: '#/FeeType'
        amount:
          type: number
          format: float
          minimum: 0
          multipleOf: 0.01
          example: 350000.00
        period:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          example: "2025-01"
        status:
          $ref: '#/FeeStatus'
        paidAmount:
          type: number
          format: float
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        description:
          type: string
          nullable: true

FeeWithHistory:
  allOf:
    - $ref: '#/Fee'
    - type: object
      properties:
        statusHistory:
          type: array
          items:
            $ref: '#/FeeStatusHistory'

MaintenanceRequest:
  allOf:
    - $ref: '#/BaseEntity'
    - type: object
      required: [unitId, title, status]
      properties:
        unitId:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          example: Fuga de agua en baño principal
        description:
          type: string
          nullable: true
        status:
          $ref: '#/MaintenanceStatus'
        assignedTo:
          type: string
          nullable: true
          description: "User ID al que se asignó la solicitud. Actualmente cadena libre, no existe relación explícita con tabla users; mejorar en v2."
        resolvedAt:
          type: string
          format: date-time
          nullable: true

Visitor:
  allOf:
    - $ref: '#/BaseEntity'
    - type: object
      required: [unitId, visitorName, entryDate]
      properties:
        unitId:
          type: string
          format: uuid
          readOnly: true
        visitorName:
          type: string
          example: Luis Pérez
        documentNumber:
          type: string
          nullable: true
        entryDate:
          type: string
          format: date-time
        exitDate:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        registeredBy:
          type: string
          format: uuid
          readOnly: true

Announcement:
  allOf:
    - $ref: '#/BaseEntity'
    - type: object
      required: [title, body, targetRoles, createdBy]
      properties:
        title:
          type: string
        body:
          type: string
        targetRoles:
          type: array
          items:
            $ref: '#/UserRole'
        createdBy:
          type: string
          format: uuid
          readOnly: true

WebsiteSections:
  type: object
  properties:
    about:
      type: object
      properties:
        title: { type: string }
        content: { type: string }
    services:
      type: object
      properties:
        title: { type: string }
        items:
          type: array
          items: { type: string }
    contact:
      type: object
      properties:
        phone: { type: string }
        email: { type: string, format: email }
        address: { type: string }

WebsiteConfig:
  type: object
  required: [clientId, updatedAt]
  properties:
    clientId:
      type: string
      format: uuid
      readOnly: true
    logoUrl:
      type: string
      format: uri
      nullable: true
    primaryColor:
      type: string
      pattern: '^#([A-Fa-f0-9]{6})$'
      nullable: true
    secondaryColor:
      type: string
      pattern: '^#([A-Fa-f0-9]{6})$'
      nullable: true
    sections:
      $ref: '#/WebsiteSections'
    updatedAt:
      type: string
      format: date-time
      readOnly: true

AuditLog:
  type: object
  required: [id, clientId, userId, entity, entityId, action, timestamp]
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    clientId:
      type: string
      format: uuid
      readOnly: true
    userId:
      type: string
      format: uuid
      readOnly: true
    entity:
      type: string
      enum: [tenant, user, property, tower, unit, resident, occupancy, fee, maintenance, visitor, announcement, website]
    entityId:
      type: string
      format: uuid
    action:
      $ref: '#/AuditAction'
    snapshot:
      type: object
      nullable: true
      properties:
        before:
          type: object
          additionalProperties: true
          nullable: true
        after:
          type: object
          additionalProperties: true
          nullable: true
    timestamp:
      type: string
      format: date-time
      readOnly: true
    ipAddress:
      type: string
      nullable: true

Metrics:
  type: object
  required: [generatedAt]
  properties:
    tenantsActive:
      type: integer
      example: 12
    tenantsSuspended:
      type: integer
      example: 2
    totalUnits:
      type: integer
      example: 847
    totalActiveUsers:
      type: integer
      example: 45
    byPlan:
      type: object
      properties:
        basic: { type: integer, example: 8 }
        premium: { type: integer, example: 4 }
        enterprise: { type: integer, example: 0 }
    generatedAt:
      type: string
      format: date-time