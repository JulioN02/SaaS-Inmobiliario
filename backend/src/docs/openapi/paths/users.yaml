collection:
  get:
    tags: [Users]
    summary: Listar usuarios internos del tenant
    description: Filtro `client_id` aplicado automáticamente desde JWT.
    operationId: listUsers
    parameters:
      - name: isActive
        in: query
        schema:
          type: boolean
      - $ref: '../components/parameters.yaml#/QueryPage'
      - $ref: '../components/parameters.yaml#/QueryLimit'
    responses:
      '200':
        description: Lista de usuarios
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/PaginatedResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas.yaml#/User'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

  post:
    tags: [Users]
    summary: Crear usuario interno
    description: |
      El `client_id` se asigna desde el JWT — nunca desde el body.
      Roles disponibles en v1: `ADMIN_TENANT`, `ADMINISTRATIVA`, `PORTERIA`.
    operationId: createUser
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password, role]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                minLength: 8
                format: password
              role:
                $ref: '../components/schemas.yaml#/UserRole'
              firstName:
                type: string
              lastName:
                type: string
    responses:
      '201':
        description: Usuario creado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/User'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'

item:
  get:
    tags: [Users]
    summary: Obtener usuario por ID
    operationId: getUserById
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    responses:
      '200':
        description: Usuario encontrado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/User'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  patch:
    tags: [Users]
    summary: Actualizar usuario
    operationId: updateUser
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              firstName: { type: string }
              lastName: { type: string }
              role:
                $ref: '../components/schemas.yaml#/UserRole'
    responses:
      '200':
        description: Usuario actualizado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/User'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

suspend:
  patch:
    tags: [Users]
    summary: Suspender usuario
    description: Desactiva acceso sin eliminar el registro.
    operationId: suspendUser
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    responses:
      '200':
        description: Usuario suspendido
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/User'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

activate:
  patch:
    tags: [Users]
    summary: Reactivar usuario suspendido
    description: Vuelve a habilitar acceso si estaba desactivado por suspensión.
    operationId: activateUser
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    responses:
      '200':
        description: Usuario reactivado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/User'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'