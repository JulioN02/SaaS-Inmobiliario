collection:
  get:
    tags: [Tenants]
    summary: Listar todos los tenants
    description: Exclusivo `SUPER_ADMIN`.
    x-required-roles: [SUPER_ADMIN]
    operationId: listTenants
    parameters:
      - name: status
        in: query
        schema:
          $ref: '../components/schemas.yaml#/TenantStatus'
      - $ref: '../components/parameters.yaml#/QueryPage'
      - $ref: '../components/parameters.yaml#/QueryLimit'
    responses:
      '200':
        description: Lista de tenants
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/PaginatedResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas.yaml#/Tenant'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

  post:
    tags: [Tenants]
    summary: Crear nuevo tenant
    description: |
      Crea cliente SaaS. Flujo automático: crea tenant → asigna plan →
      crea usuario `ADMIN_TENANT` inicial → inicializa config website.
      Exclusivo `SUPER_ADMIN`.
    x-required-roles: [SUPER_ADMIN]
    operationId: createTenant
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, subdomain, plan, adminEmail, adminPassword]
            properties:
              name:
                type: string
                minLength: 3
                maxLength: 100
                example: Conjunto Residencial El Prado
              subdomain:
                type: string
                minLength: 3
                maxLength: 50
                pattern: '^[a-z0-9-]+$'
                example: elprado
              plan:
                $ref: '../components/schemas.yaml#/TenantPlan'
              adminEmail:
                type: string
                format: email
                example: admin@elprado.com
              adminPassword:
                type: string
                minLength: 8
                format: password
              contactPhone:
                type: string
                nullable: true
    responses:
      '201':
        description: Tenant creado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Tenant'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'

item:
  get:
    tags: [Tenants]
    summary: Obtener tenant por ID
    operationId: getTenantById
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    responses:
      '200':
        description: Tenant encontrado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Tenant'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  patch:
    tags: [Tenants]
    summary: Actualizar datos del tenant
    x-required-roles: [SUPER_ADMIN]
    operationId: updateTenant
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                minLength: 3
                maxLength: 100
              contactEmail:
                type: string
                format: email
              contactPhone:
                type: string
              # el plan se modifica mediante endpoint dedicado /plan, ver documentación
    responses:
      '200':
        description: Tenant actualizado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Tenant'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

suspend:
  patch:
    tags: [Tenants]
    summary: Suspender tenant
    x-required-roles: [SUPER_ADMIN]
    description: |
      Bloquea login de todos sus usuarios. Website opcionalmente deshabilitado.
      Exclusivo `SUPER_ADMIN`.
    operationId: suspendTenant
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    responses:
      '200':
        description: Tenant suspendido
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Tenant'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

plan:
  patch:
    tags: [Tenants]
    summary: Cambiar plan del tenant
    x-required-roles: [SUPER_ADMIN]
    operationId: changeTenantPlan
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [plan]
            properties:
              plan:
                $ref: '../components/schemas.yaml#/TenantPlan'
    responses:
      '200':
        description: Plan modificado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Tenant'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

activate:
  patch:
    tags: [Tenants]
    summary: Reactivar tenant suspendido
    operationId: activateTenant
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    responses:
      '200':
        description: Tenant reactivado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Tenant'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'