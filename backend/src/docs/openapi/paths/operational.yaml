# ── MAINTENANCE ──────────────────────────────────────────────────────────────

maintenanceCollection:
  get:
    tags: [Maintenance]
    summary: Listar solicitudes de mantenimiento
    operationId: listMaintenanceRequests
    parameters:
      - name: unitId
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          $ref: '../components/schemas.yaml#/MaintenanceStatus'
      - $ref: '../components/parameters.yaml#/QueryPage'
      - $ref: '../components/parameters.yaml#/QueryLimit'
    responses:
      '200':
        description: Lista de solicitudes
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/PaginatedResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas.yaml#/MaintenanceRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

  post:
    tags: [Maintenance]
    summary: Crear solicitud de mantenimiento
    description: Estado inicial `PENDING`. Genera evento auditable.
    operationId: createMaintenanceRequest
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [unitId, title]
            properties:
              unitId:
                type: string
                format: uuid
              title:
                type: string
                minLength: 5
                maxLength: 100
                example: Fuga de agua en baño principal
              description:
                type: string
                nullable: true
                maxLength: 500
    responses:
      '201':
        description: Solicitud creada
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/MaintenanceRequest'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

maintenanceItem:
  get:
    tags: [Maintenance]
    summary: Obtener solicitud por ID
    operationId: getMaintenanceRequestById
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    responses:
      '200':
        description: Solicitud encontrada
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/MaintenanceRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  patch:
    tags: [Maintenance]
    summary: Actualizar solicitud de mantenimiento
    description: Genera evento auditable al cambiar estado.
    operationId: updateMaintenanceRequest
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                $ref: '../components/schemas.yaml#/MaintenanceStatus'
              assignedTo:
                type: string
                nullable: true
                maxLength: 100
              description:
                type: string
                nullable: true
                maxLength: 500
    responses:
      '200':
        description: Solicitud actualizada
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/MaintenanceRequest'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

# ── VISITORS ─────────────────────────────────────────────────────────────────

visitorsCollection:
  get:
    tags: [Visitors]
    summary: Listar registro de visitantes
    x-required-roles: [PORTERIA, ADMIN_TENANT, ADMINISTRATIVA]
    operationId: listVisitors
    parameters:
      - name: unitId
        in: query
        schema:
          type: string
          format: uuid
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        schema:
          type: string
          format: date
      - $ref: '../components/parameters.yaml#/QueryPage'
      - $ref: '../components/parameters.yaml#/QueryLimit'
    responses:
      '200':
        description: Lista de visitantes
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/PaginatedResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas.yaml#/Visitor'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

  post:
    tags: [Visitors]
    summary: Registrar visitante
    description: Registro manual de entrada por portería.
    x-required-roles: [PORTERIA, ADMIN_TENANT, ADMINISTRATIVA]
    operationId: createVisitor
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [unitId, visitorName, entryDate]
            properties:
              unitId:
                type: string
                format: uuid
              visitorName:
                type: string
                minLength: 3
                maxLength: 100
                example: Luis Pérez
              documentNumber:
                type: string
                nullable: true
                maxLength: 20
              entryDate:
                type: string
                format: date-time
              notes:
                type: string
                nullable: true
                maxLength: 200
    responses:
      '201':
        description: Visitante registrado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Visitor'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

checkoutVisitor:
  patch:
    tags: [Visitors]
    summary: Registrar salida del visitante
    operationId: checkoutVisitor
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [exitDate]
            properties:
              exitDate:
                type: string
                format: date-time
              notes:
                type: string
                nullable: true
    responses:
      '200':
        description: Visitante actualizado con fecha de salida
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Visitor'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

# ── ANNOUNCEMENTS ─────────────────────────────────────────────────────────────

announcementsCollection:
  get:
    tags: [Announcements]
    summary: Listar anuncios
    description: Filtrados automáticamente por el rol del usuario autenticado.
    x-required-roles: [ADMIN_TENANT, ADMINISTRATIVA, PORTERIA]
    operationId: listAnnouncements
    parameters:
      - $ref: '../components/parameters.yaml#/QueryPage'
      - $ref: '../components/parameters.yaml#/QueryLimit'
    responses:
      '200':
        description: Lista de anuncios
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/PaginatedResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas.yaml#/Announcement'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
  post:
    tags: [Announcements]
    summary: Crear anuncio segmentado por rol
    description: Solo `ADMIN_TENANT` y `ADMINISTRATIVA`.
    x-required-roles: [ADMIN_TENANT, ADMINISTRATIVA]
    operationId: createAnnouncement
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, body, targetRoles]
            properties:
              title:
                type: string
                minLength: 5
                maxLength: 100
              body:
                type: string
                minLength: 10
                maxLength: 2000
              targetRoles:
                type: array
                minItems: 1
                items:
                  $ref: '../components/schemas.yaml#/UserRole'
    responses:
      '201':
        description: Anuncio creado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Announcement'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

announcementsItem:
  parameters:
    - $ref: '../components/parameters.yaml#/PathId'
  get:
    tags: [Announcements]
    summary: Obtener anuncio por ID
    operationId: getAnnouncementById
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    responses:
      '200':
        description: Anuncio encontrado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Announcement'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  patch:
    tags: [Announcements]
    summary: Actualizar anuncio
    operationId: updateAnnouncement
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
                minLength: 5
                maxLength: 100
              body:
                type: string
                minLength: 10
                maxLength: 2000
              targetRoles:
                type: array
                items:
                  $ref: '../components/schemas.yaml#/UserRole'
    responses:
      '200':
        description: Anuncio actualizado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Announcement'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  delete:
    tags: [Announcements]
    summary: Eliminar anuncio
    operationId: deleteAnnouncement
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    responses:
      '204':
        description: Anuncio eliminado
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
# ── WEBSITE ──────────────────────────────────────────────────────────────────

websiteConfig:
  get:
    tags: [Website]
    summary: Obtener configuración del sitio institucional
    operationId: getWebsiteConfig
    responses:
      '200':
        description: Configuración del website
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/WebsiteConfig'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  patch:
    tags: [Website]
    summary: Actualizar configuración del sitio
    description: Solo `ADMIN_TENANT`.
    operationId: updateWebsiteConfig
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              logoUrl:
                type: string
                format: uri
                nullable: true
              primaryColor:
                type: string
                pattern: '^#([A-Fa-f0-9]{6})$'
                nullable: true
              secondaryColor:
                type: string
                pattern: '^#([A-Fa-f0-9]{6})$'
                nullable: true
              sections:
                $ref: '../components/schemas.yaml#/WebsiteSections'
    responses:
      '200':
        description: Configuración actualizada
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/WebsiteConfig'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

# ── ROLES ────────────────────────────────────────────────────────────────────

rolesCollection:
  get:
    tags: [Roles]
    summary: Listar roles y permisos del sistema
    description: Roles base cargados por seed. No editables por cliente en v1.
    operationId: listRoles
    responses:
      '200':
        description: Lista de roles
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/PaginatedResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas.yaml#/Role'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

# ── AUDIT ────────────────────────────────────────────────────────────────────

auditCollection:
  get:
    tags: [Audit]
    summary: Consultar log de auditoría
    x-required-roles: [SUPER_ADMIN, ADMIN_TENANT]
    description: |
      Log inmutable. Solo `SUPER_ADMIN` y `ADMIN_TENANT`.
      No permite borrado físico por diseño.
    operationId: listAuditLogs
    parameters:
      - name: entity
        in: query
        schema:
          type: string
          enum: [tenant, user, property, tower, unit, resident, occupancy, fee, maintenance, visitor, announcement, website]
      - name: action
        in: query
        schema:
          $ref: '../components/schemas.yaml#/AuditAction'
      - name: userId
        in: query
        schema:
          type: string
          format: uuid
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        schema:
          type: string
          format: date
      - $ref: '../components/parameters.yaml#/QueryPage'
      - $ref: '../components/parameters.yaml#/QueryLimit'
    responses:
      '200':
        description: Lista de eventos de auditoría
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/PaginatedResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas.yaml#/AuditLog'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

# ── METRICS ──────────────────────────────────────────────────────────────────

metricsResource:
  get:
    tags: [Metrics]
    summary: Métricas internas del negocio SaaS
    description: Exclusivo `SUPER_ADMIN`. No visible para clientes.
    operationId: getMetrics
    responses:
      '200':
        description: Métricas de la plataforma
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Metrics'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'