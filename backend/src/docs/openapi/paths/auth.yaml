login:
  post:
    tags: [Auth]
    summary: Autenticación de usuario interno
    description: |
      Retorna un JWT firmado con `user_id`, `client_id` y `role` en el payload.
      El `client_id` del token es la única fuente válida para resolver el tenant.
    security: []
    operationId: loginUser
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
                example: admin@conjuntorosa.com
              password:
                type: string
                format: password
                minLength: 8
    responses:
      '200':
        description: Autenticación exitosa
        content:
          application/json:
            schema:
              type: object
              required: [accessToken, expiresIn, user]
              properties:
                accessToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                expiresIn:
                  type: integer
                  example: 86400
                user:
                  type: object
                  required: [id, email, role, clientId]
                  properties:
                    id:
                      type: string
                      format: uuid
                    email:
                      type: string
                      format: email
                    role:
                      $ref: '../components/schemas.yaml#/UserRole'
                    clientId:
                      type: string
                      format: uuid
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'