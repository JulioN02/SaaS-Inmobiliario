collection:
  get:
    tags: [Residents]
    summary: Listar residentes del tenant
    operationId: listResidents
    parameters:
      - name: search
        in: query
        description: Búsqueda por nombre o número de documento
        schema:
          type: string
      - $ref: '../components/parameters.yaml#/QueryPage'
      - $ref: '../components/parameters.yaml#/QueryLimit'
    responses:
      '200':
        description: Lista de residentes
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/PaginatedResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas.yaml#/Resident'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

  post:
    tags: [Residents]
    summary: Crear residente
    description: |
      Registra un residente. La asignación a unidad se hace en `POST /occupancies`.
      Genera evento auditable.
    operationId: createResident
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [firstName, lastName, documentType, documentNumber]
            properties:
              firstName:
                type: string
                minLength: 2
                maxLength: 50
                example: María
              lastName:
                type: string
                minLength: 2
                maxLength: 50
                example: González
              documentType:
                type: string
                enum: [CC, CE, PASSPORT, NIT]
              documentNumber:
                type: string
                minLength: 5
                maxLength: 20
                example: "1098765432"
              email:
                type: string
                format: email
                nullable: true
              phone:
                type: string
                nullable: true
              emergencyContact:
                type: string
                nullable: true
                maxLength: 100
    responses:
      '201':
        description: Residente creado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Resident'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'

item:
  get:
    tags: [Residents]
    summary: Obtener residente por ID
    operationId: getResidentById
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    responses:
      '200':
        description: Residente encontrado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Resident'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  patch:
    tags: [Residents]
    summary: Actualizar residente
    description: Genera evento auditable.
    operationId: updateResident
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              firstName:
                type: string
                minLength: 2
                maxLength: 50
              lastName:
                type: string
                minLength: 2
                maxLength: 50
              email:
                type: string
                format: email
                nullable: true
              phone:
                type: string
                nullable: true
              emergencyContact:
                type: string
                nullable: true
    responses:
      '200':
        description: Residente actualizado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Resident'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  delete:
    tags: [Residents]
    summary: Eliminar residente (soft delete)
    description: Bloqueado si tiene occupancies históricas. Genera evento auditable.
    operationId: deleteResident
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    responses:
      '204':
        description: Eliminado (soft delete)
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'