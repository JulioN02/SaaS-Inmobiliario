collection:
  get:
    tags: [Fees]
    summary: Listar cuotas del tenant
    description: Registros administrativos — no transacciones bancarias.
    operationId: listFees
    parameters:
      - name: unitId
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          $ref: '../components/schemas.yaml#/FeeStatus'
      - name: type
        in: query
        schema:
          $ref: '../components/schemas.yaml#/FeeType'
      - name: periodFrom
        in: query
        description: Periodo desde (YYYY-MM)
        schema:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          example: "2025-01"
      - name: periodTo
        in: query
        description: Periodo hasta (YYYY-MM)
        schema:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          example: "2025-12"
      - $ref: '../components/parameters.yaml#/QueryPage'
      - $ref: '../components/parameters.yaml#/QueryLimit'
    responses:
      '200':
        description: Lista de cuotas
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/PaginatedResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas.yaml#/Fee'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

  post:
    tags: [Fees]
    summary: Registrar cuota
    description: Estado inicial siempre `PENDING`. Genera evento auditable.
    operationId: createFee
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [unitId, type, amount, period]
            properties:
              unitId:
                type: string
                format: uuid
              type:
                $ref: '../components/schemas.yaml#/FeeType'
              amount:
                type: number
                format: float
                minimum: 0.01
                multipleOf: 0.01
                example: 350000.00
              period:
                type: string
                pattern: '^\d{4}-(0[1-9]|1[0-2])$'
                example: "2025-01"
              dueDate:
                type: string
                format: date
                nullable: true
              description:
                type: string
                nullable: true
                maxLength: 200
    responses:
      '201':
        description: Cuota registrada
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Fee'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'

item:
  get:
    tags: [Fees]
    summary: Obtener cuota por ID con historial de estados
    operationId: getFeeById
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    responses:
      '200':
        description: Cuota con historial
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/FeeWithHistory'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

status:
  patch:
    tags: [Fees]
    summary: Cambiar estado de una cuota
    description: |
      Transiciones permitidas:
      `PENDING → PAID | PARTIAL` | `PARTIAL → PAID`
      No se puede revertir `PAID`. Genera evento auditable.
    operationId: updateFeeStatus
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                $ref: '../components/schemas.yaml#/FeeStatus'
              paidAmount:
                type: number
                format: float
                minimum: 0.01
                multipleOf: 0.01
                nullable: true
                description: Requerido si el nuevo estado es `PARTIAL`
              notes:
                type: string
                nullable: true
                maxLength: 300
    responses:
      '200':
        description: Estado actualizado
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Fee'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'