openapi: 3.0.3

info:
  title: Real Estate SaaS — API REST v1
  version: 1.0.0
  description: |
    API REST **API-First** para gestión administrativa de inmuebles residenciales
    como plataforma **SaaS multi-tenant**.

    Cualquier cambio incompatible genera `/api/v2/` — este contrato es inmutable.

    ## Modelo de Dominio
    ```
    Tenant → Property → Tower? → Unit → Occupancy ← Resident
    ```

    ## Seguridad
    - JWT Bearer en todos los endpoints excepto `/auth/login`
    - `client_id` se extrae del JWT — nunca del body
    - RBAC dinámico: rol + `client_id` evaluados por request

    ## Roles
    | Rol             | Scope                              |
    |-----------------|------------------------------------|
    | SUPER_ADMIN     | Plataforma completa                |
    | ADMIN_TENANT    | Control total de su tenant         |
    | ADMINISTRATIVA  | Residentes, cuotas, reportes       |
    | PORTERIA        | Visitantes + lectura de anuncios   |

    ## Alcances v1
    - El módulo **`documents`** mencionado en el AGENTS.md está fuera de alcance para la v1; no existen endpoints ni entidades asociadas.
    - El módulo **`subscription`** no cuenta con entidad propia en este contrato. El plan se almacena como campo `plan` en el recurso Tenant y no se lleva historial de cambios. Este comportamiento se mantiene por simplicidad, aunque la documentación de arquitectura lo nombra como módulo separado.

  contact:
    name: Dev
    email: dev@tudominio.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /api/v1
    description: Local
  - url: https://api.tudominio.com/api/v1
    description: Production

tags:
  - name: Auth
    description: Autenticación JWT stateless
  - name: Tenants
    description: Clientes SaaS — solo `SUPER_ADMIN`
  - name: Users
    description: Usuarios internos con RBAC
  - name: Roles
    description: Roles y permisos del sistema
  - name: Properties
    description: Inmuebles del tenant
  - name: Towers
    description: Torres opcionales dentro de una propiedad
  - name: Units
    description: Unidades habitacionales / comerciales
  - name: Residents
    description: Propietarios y arrendatarios
  - name: Occupancies
    description: Relación residente–unidad con historial obligatorio
  - name: Fees
    description: Cuotas administrativas sin pasarela de pago
  - name: Maintenance
    description: Solicitudes de mantenimiento
  - name: Visitors
    description: Registro de visitantes — portería
  - name: Announcements
    description: Anuncios segmentados por rol
  - name: Website
    description: Configuración del sitio institucional del tenant
  - name: Audit
    description: Log inmutable — solo SUPER_ADMIN y ADMIN_TENANT
  - name: Metrics
    description: Métricas internas SaaS — solo SUPER_ADMIN

security:
  - bearerAuth: []

paths:
  # Auth
  /auth/login:
    $ref: "./paths/auth.yaml#/login"

  # Tenants
  /tenants:
    $ref: "./paths/tenants.yaml#/collection"
  /tenants/{id}:
    $ref: "./paths/tenants.yaml#/item"
  /tenants/{id}/suspend:
    $ref: "./paths/tenants.yaml#/suspend"
  /tenants/{id}/activate:
    $ref: "./paths/tenants.yaml#/activate"
  /tenants/{id}/plan:
    $ref: "./paths/tenants.yaml#/plan"

  # Users
  /users:
    $ref: "./paths/users.yaml#/collection"
  /users/{id}:
    $ref: "./paths/users.yaml#/item"
  /users/{id}/suspend:
    $ref: "./paths/users.yaml#/suspend"
  /users/{id}/activate:
    $ref: "./paths/users.yaml#/activate"

  # Roles
  /roles:
    $ref: "./paths/operational.yaml#/rolesCollection"

  # Properties
  /properties:
    $ref: "./paths/properties.yaml#/propertiesCollection"
  /properties/{id}:
    $ref: "./paths/properties.yaml#/propertyItem"
  /properties/{propertyId}/towers:
    $ref: "./paths/properties.yaml#/towersCollection"
  /properties/{propertyId}/towers/{id}:
    $ref: "./paths/properties.yaml#/towerItem"

  # Units
  /units:
    $ref: "./paths/units.yaml#/collection"
  /units/{id}:
    $ref: "./paths/units.yaml#/item"

  # Residents
  /residents:
    $ref: "./paths/residents.yaml#/collection"
  /residents/{id}:
    $ref: "./paths/residents.yaml#/item"

  # Occupancies
  /occupancies:
    $ref: "./paths/occupancies.yaml#/collection"
  /occupancies/{id}:
    $ref: "./paths/occupancies.yaml#/item"
  /occupancies/{id}/close:
    $ref: "./paths/occupancies.yaml#/close"

  # Fees
  /fees:
    $ref: "./paths/fees.yaml#/collection"
  /fees/{id}:
    $ref: "./paths/fees.yaml#/item"
  /fees/{id}/status:
    $ref: "./paths/fees.yaml#/status"

  # Maintenance
  /maintenance:
    $ref: "./paths/operational.yaml#/maintenanceCollection"
  /maintenance/{id}:
    $ref: "./paths/operational.yaml#/maintenanceItem"

  # Visitors
  /visitors:
    $ref: "./paths/operational.yaml#/visitorsCollection"
  /visitors/{id}/checkout:
    $ref: "./paths/operational.yaml#/checkoutVisitor"

  # Announcements
  /announcements:
    $ref: "./paths/operational.yaml#/announcementsCollection"
  /announcements/{id}:
    $ref: "./paths/operational.yaml#/announcementsItem"

  # Website
  /website:
    $ref: "./paths/operational.yaml#/websiteConfig"

  # Audit
  /audit:
    $ref: "./paths/operational.yaml#/auditCollection"

  # Metrics
  /metrics:
    $ref: "./paths/operational.yaml#/metricsResource"

