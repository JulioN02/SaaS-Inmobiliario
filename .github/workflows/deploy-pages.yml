# =============================================================================
# Deploy Frontend to GitHub Pages
# =============================================================================
# This workflow builds the Vite frontend and deploys it to GitHub Pages.
# The frontend is a static SPA — the backend API must be deployed separately.
#
# Required secrets (set in GitHub repo → Settings → Secrets and variables → Actions):
#   VITE_API_URL   — URL of the deployed backend (e.g. https://api.tudominio.com)
# =============================================================================

name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - chore/issue-templates
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3000' }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
